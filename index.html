<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<!-- charset must be in the first 1024 bytes, or the parser can restart —
		     keep this the very first thing in <head>. -->
		<meta charset="UTF-8" />
		<!-- Fonts are self-hosted (src/styles/fonts.css) — no external font host,
		     no @import, no render-blocking cross-origin round trip. This inline
		     background is the only thing painted before the app's own CSS loads,
		     so the pre-hydration flash is cream (--bg-canvas) instead of white.
		     data-theme is hardcoded "light" above and nothing in src/ ever
		     changes it at runtime, so dark mode can never apply here — no
		     cream-then-dark flash risk. -->
		<style>
			html {
				background: #faf8f5;
			}
		</style>
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="description" content="Nothing To Wear — your closet, inventoried. Track, import, and rediscover what you own." />
		<!-- E5-2.3: PWA / iOS add-to-home-screen. theme-color matches the app's
		     light header surface; apple-mobile-web-app-capable makes the installed
		     app launch full-screen without Safari chrome. -->
		<meta name="theme-color" content="#faf8f5" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="NTW" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<title>Nothing To Wear</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
